name: FluxTube Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-portable:
    name: Windows x64 Portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Workspace Tests
        run: cargo test --workspace
      - name: Run E2E Offline Test Suite
        run: cargo test --manifest-path tests/Cargo.toml
      - name: Package Windows Portable Zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          .\scripts\package_windows.ps1 -Version $ver
          $zip = "dist\windows\FluxTube-$ver-portable-x64.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -Path "$zip.sha256" -Encoding ASCII
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $zip = "dist/windows/FluxTube-$ver-portable-x64.zip"
          $sha = "$zip.sha256"
          gh release create "${{ github.ref_name }}" $zip $sha `
            --title "FluxTube ${{ github.ref_name }} (Windows x64 Portable)" `
            --generate-notes
