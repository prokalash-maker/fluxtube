[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/security",
    "crates/settings",
    "crates/localization",
    "crates/diagnostics",
    "crates/network",
    "crates/auth",
    "crates/youtube-api",
    "crates/player",
    "crates/player-native",
    "crates/player-embed",
    "crates/cache",
    "crates/platform",
    "crates/updater",
    "crates/design-system",
    "crates/ui",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80.0"
authors = ["FluxTube Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal member crates
fluxtube-core = { path = "crates/core" }
fluxtube-storage = { path = "crates/storage" }
fluxtube-security = { path = "crates/security" }
fluxtube-network = { path = "crates/network" }
fluxtube-auth = { path = "crates/auth" }
fluxtube-youtube-api = { path = "crates/youtube-api" }
fluxtube-player = { path = "crates/player" }
fluxtube-player-native = { path = "crates/player-native" }
fluxtube-player-embed = { path = "crates/player-embed" }
fluxtube-cache = { path = "crates/cache" }
fluxtube-platform = { path = "crates/platform" }
fluxtube-updater = { path = "crates/updater" }
fluxtube-design-system = { path = "crates/design-system" }
fluxtube-ui = { path = "crates/ui" }

# GUI Framework (Iced with wgpu + tiny-skia software fallback)
iced = { version = "0.13", features = ["tokio", "image", "svg"] }

# Media, Graphics & WebView
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rayon = "1.10"
wry = "0.57"
raw-window-handle = "0.6"

# Async runtime & HTTP
tokio = { version = "1.41", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
bytes = "1.8"
url = "2.5"
async-trait = "0.1"

# Crypto, Hashing & Encoding
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"

# Time & Timezone
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# SQLite & Persistence
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Security & Keyring
keyring = { version = "3", features = ["apple-native", "windows-native"] }
zeroize = { version = "1.8", features = ["derive"] }

# Concurrency
parking_lot = "0.12"

# OS utilities
open = "5.3"

# System Telemetry & Logging
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Error Handling
thiserror = "2.0"

# Testing & Mocking
wiremock = "0.6"
tempfile = "3.14"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 0
debug = true
